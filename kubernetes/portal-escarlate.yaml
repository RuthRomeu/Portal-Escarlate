          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: "3005"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: EMAIL_EVENTS_ENABLED
              value: "true"
            - name: REGISTRATION_SERVICE_URL
              value: "http://dart-registration:3003"
            - name: PASSWORD_RECOVERY_SERVICE_URL
              value: "http://dart-password-recovery:3009"
            - name: DATABASE_URL
              value: "postgresql://portal:$(PORTAL_DB_PASSWORD)@postgres:5432/email_db?sslmode=disable"
            - name: PORTAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-escarlate-env
                  key: PORTAL_DB_PASSWORD
                  optional: true
          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
              readOnly: true
      volumes:
        - name: env-file
          secret:
            secretName: portal-escarlate-env

---
apiVersion: v1
kind: Service
metadata:
  name: dart-email
spec:
  selector:
    app: dart-email
  ports:
    - port: 3005
      targetPort: 3005

---
# Gateway Dart (porta 3100)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dart-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dart-gateway
  template:
    metadata:
      labels:
        app: dart-gateway
    spec:
      containers:
        - name: dart-gateway
          image: portal-escarlate-dart:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: HTTP_HOST
              value: "0.0.0.0"
            - name: HTTP_PORT
              value: "3100"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: LEGACY_BACKEND_URL
              value: "http://node-gateway:3000"
            - name: AUTH_SERVICE_URL
              value: "http://dart-auth:3001"
            - name: REGISTRATION_SERVICE_URL
              value: "http://dart-registration:3003"
            - name: PASSWORD_RECOVERY_SERVICE_URL
              value: "http://dart-password-recovery:3009"
            - name: EMAIL_SERVICE_URL
              value: "http://dart-email:3005"
          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
              readOnly: true
      volumes:
        - name: env-file
          secret:
            secretName: portal-escarlate-env

---
apiVersion: v1
kind: Service
metadata:
  name: dart-gateway
spec:
  type: NodePort
  selector:
    app: dart-gateway
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30100

