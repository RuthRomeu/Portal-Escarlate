---
# Event Service (barramento)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-events
  template:
    metadata:
      labels:
        app: node-events
    spec:
      containers:
        - name: node-events
          image: portal-escarlate-node:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "--env-file=.env", "backend/src/services/events/server.js"]
          env:
            - name: EVENT_SERVICE_PORT
              value: "3007"
            - name: HOST
              value: "0.0.0.0"
            - name: AUTH_SERVICE_URL
              value: "http://node-auth:3001"
            - name: REGISTRATION_SERVICE_URL
              value: "http://node-registration:3003"
            - name: PASSWORD_RECOVERY_SERVICE_URL
              value: "http://node-password-recovery:3009"
            - name: EMAIL_SERVICE_URL
              value: "http://node-email:3006"
            - name: NEWS_SERVICE_URL
              value: "http://node-news:3002"
            - name: AI_SERVICE_URL
              value: "http://node-ai:3004"
            - name: NEWS_SUMMARY_SERVICE_URL
              value: "http://node-news-summary:3005"
            - name: ARTICLE_SUMMARY_SERVICE_URL
              value: "http://node-article-summary:3008"
          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
              readOnly: true
      volumes:
        - name: env-file
          secret:
            secretName: portal-escarlate-env

---
apiVersion: v1
kind: Service
metadata:
  name: node-events
spec:
  selector:
    app: node-events
  ports:
    - port: 3007
      targetPort: 3007

