# Manifesto Kubernetes — Portal Escarlate
# Testado com Minikube.
#
# Pré-requisitos:
#   minikube start --driver=docker
#   kubectl create secret generic portal-escarlate-env --from-file=.env=.env
#
# Build e carga das imagens:
#   docker build -t portal-escarlate-node:latest .
#   docker build -t portal-escarlate-dart:latest --build-arg APP=api_gateway ./backend-dart
#   docker build -t portal-escarlate-dart-auth:latest --build-arg APP=auth_service ./backend-dart
#   docker build -t portal-escarlate-dart-registration:latest --build-arg APP=registration_service ./backend-dart
#   docker build -t portal-escarlate-dart-recovery:latest --build-arg APP=password_recovery_service ./backend-dart
#   docker build -t portal-escarlate-dart-email:latest --build-arg APP=email_service ./backend-dart
#   minikube image load portal-escarlate-node:latest
#   minikube image load portal-escarlate-dart:latest
#   (repetir para cada imagem Dart)
#
# Aplicar:
#   kubectl apply -f kubernetes/portal-escarlate.yaml
#
# Acessar:
#   minikube service dart-gateway --url   → gateway Dart (3100)
#   minikube service node-gateway --url   → gateway Node.js (3000)
#   minikube service frontend --url       → frontend web (5173)

# =============================================================================
# INFRAESTRUTURA
# =============================================================================

---
# PostgreSQL — banco único com múltiplos schemas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "portal"
            - name: POSTGRES_DB
              value: "portal_escarlate"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-escarlate-env
                  key: PORTAL_DB_PASSWORD
                  optional: true
          volumeMounts:
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "portal", "-d", "portal_escarlate"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init-scripts
        - name: pg-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# ConfigMap com os scripts SQL de inicialização
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  01-dart-init.sql: |
    CREATE DATABASE auth_db;
    CREATE DATABASE registration_db;
    CREATE DATABASE password_recovery_db;
    CREATE DATABASE email_db;

---
# NATS JetStream — barramento de eventos para o Dart
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.12-alpine
          imagePullPolicy: IfNotPresent
          args: ["--jetstream"]
          ports:
            - containerPort: 4222

---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector:
    app: nats
  ports:
    - port: 4222
      targetPort: 4222

